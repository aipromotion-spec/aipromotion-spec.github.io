<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <filter id="grainCo">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.79
                0 0 0 0 0.66
                0 0 0 0 0.38
                0 0 0 0.05 0"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#1F1B15"/>
  <rect width="1200" height="900" filter="url(#grainCo)"/>
  <text x="600" y="640" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="600" font-size="300"
        fill="none" stroke="#C9A961" stroke-opacity="0.16" stroke-width="2"
        text-anchor="middle">1999</text>
  <line x1="120" y1="470" x2="360" y2="470" stroke="#C9A961" stroke-width="1.4"/>
  <text x="120" y="430" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="600"
        font-size="30" fill="#C9A961">Company</text>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#C9A961" stroke-width="1" stroke-opacity="0.5"/>
</svg>
