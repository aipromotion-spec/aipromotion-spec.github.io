<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <filter id="grainShop">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.10
                0 0 0 0 0.10
                0 0 0 0 0.10
                0 0 0 0.045 0"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#E6DCC7"/>
  <rect width="1200" height="900" filter="url(#grainShop)"/>
  <text x="640" y="700" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="600" font-size="520"
        fill="none" stroke="#1A1A1A" stroke-opacity="0.06" stroke-width="2"
        text-anchor="middle">02</text>
  <line x1="120" y1="470" x2="360" y2="470" stroke="#C9A961" stroke-width="1.4"/>
  <text x="120" y="430" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="600"
        font-size="30" fill="#A98942">Store</text>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#C9A961" stroke-width="1" stroke-opacity="0.7"/>
</svg>
